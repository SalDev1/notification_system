spring.application.name=notification-delivery-sys

spring.datasource.url=jdbc:postgresql://localhost:5432/notifications_db
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=3000

# Ensures that Kafka Producer doesn't retry messages again and again due to network or broker errors.
# Prevents retry-related duplicates
spring.kafka.producer.properties.max.enable.idempotence=true
spring.kafka.producer.properties.max.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.compression.type=snappy

spring.kafka.consumer.group-id=notifications-test-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted

# Adding Distributed Logging Configuration
# The Sampling Probability determine what percentage of traces get recorded.
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.file.name=logs/notification-service.log
logging.level.root=INFO

resilience4j.circuitbreaker.instances.userPreference.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userPreference.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userPreference.slidingWindowSize=20
resilience4j.circuitbreaker.instances.userPreference.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.userPreference.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userPreference.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userPreference.permittedNumberOfCallsInHalfOpenState=3

# Configuring bulkhead & Retry for userpreference.
resilience4j.retry.instances.userPreference.maxAttempts=3
resilience4j.retry.instances.userPreference.waitDuration=500ms
resilience4j.retry.instances.userPreference.enableExponentialBackoff=true

resilience4j.retry.instances.userPreference.exponentialBackoffMultiplier=2
resilience4j.retry.instances.userPreference.retryExceptions=java.io.IOException, java.util.concurrent.TimeoutException
resilience4j.bulkhead.instances.userPreference.maxConcurrentCalls=20
resilience4j.bulkhead.instances.userPreference.maxWaitDuration=0

# Configuring Independent bulkhead limit for Email Channel
resilience4j.bulkhead.instances.emailChannel.maxConcurrentCalls=10
resilience4j.bulkhead.instances.emailChannel.maxWaitDuration=0

# Configuring Independent bulkhead limit for InApp Channel
resilience4j.bulkhead.instances.inAppChannel.maxConcurrentCalls=10
resilience4j.bulkhead.instances.inAppChannel.maxWaitDuration=0

# Configuring Independent bulkhead limit for SMS Channel
resilience4j.bulkhead.instances.smsChannel.maxConcurrentCalls=10
resilience4j.bulkhead.instances.smsChannel.maxWaitDuration=0